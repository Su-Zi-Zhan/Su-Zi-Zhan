        summary: S.-T. Yau College Student Mathematics Contest is initiated by Professor Shing-Tung Yau in 2010. The contest is divided into six subjects — Geometry and topology, Algebra and Number Theory, Probability and Statistics, Applied and Computational Mathematics, Analysis and Partial Differential Equations, Math Physics. It focuses on examining college students' basic knowledge and basic skills of mathematics comprehensively, and selecting excellent mathematical talents according to the standards of postgraduate examination in first-class universities abroad. It aims to encourage students to make comprehensive progress in basic knowledge, comprehensive ability and academic accomplishment of mathematics, and to promote the development of mathematics education in Chinese universities. Since the contest has been established, more than 25,000 college students from more than 600 universities in mainland China, Hong Kong and Taiwan have taken part in the contest. More than 980 students were awarded prizes. S.-T. Yau College Student Mathematics Contest has played an important role in cultivating Chinese mathematical talents, and has become an important reference for the discovery and selection of young mathematical talents and the admission of graduate students of mathematics and related majors in the famous universities across the world.

